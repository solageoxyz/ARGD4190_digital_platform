<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://use.typekit.net/yuk8wzr.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design Works</title>
</head>
<body>
    <header class="header megrim">
        <h1>Graphic Design Works</h1>
        <ul class="nav-link">
            <li><a href="../index.html">home</a></li>
        </ul>   
    </header>

    <section class="gallery-section">
        <div class="gallery">
            <div class="gallery-item">
                <img src="../images/gdp1.png" alt="Description of image 1">
                <div class="caption">STARH0LD</div>
            </div>
            
            <div class="gallery-item">
                <img src="../images/gdp2.png" alt="Description of image 2">
                <div class="caption"> S0UND</div>
            </div>

            <div class="gallery-item">
                <img src="../images/gdp3.png" alt="Description of image 3">
                <div class="caption">LENT T0 Y0U</div>
            </div>

            <div class="gallery-item">
                <img src="../images/gdp4.png" alt="Description of image 4">
                <div class="caption">0PEN H0USE</div>
            </div>
        </div>
    </section>

    <!-- Fullscreen Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" class="lightbox-content" src="" alt="Full view">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- JavaScript to handle click events -->
    <script>
        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', () => {
                const img = item.querySelector('img');
                const caption = item.querySelector('.caption');
                
                document.getElementById('lightbox-img').src = img.src;
                document.getElementById('lightbox-caption').textContent = caption ? caption.textContent : '';
                document.getElementById('lightbox').style.display = 'flex';
            });
        });

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }
    </script>
</body>
</html>
